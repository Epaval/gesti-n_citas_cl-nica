{% extends 'core/base.html' %}

{% block titulo %}Iniciar Sesión{% endblock %}

{% block contenido %}
<div class="grid-x grid-padding-x align-center" style="margin-top: 50px;">
    <div class="cell medium-6 large-4">
        <div class="card">
            <div class="card-section">
                <h3 class="text-center"><i class="fas fa-hospital"></i> Sistema de Citas</h3>
                <hr>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="input-group">
                        <span class="input-group-label"><i class="fas fa-user"></i></span>
                        <input class="input-group-field" type="text" name="username" placeholder="Usuario" required>
                    </div>
                    
                    <div class="input-group" style="margin-top: 15px;">
                        <span class="input-group-label"><i class="fas fa-lock"></i></span>
                        <input class="input-group-field" type="password" name="password" placeholder="Contraseña" required>
                    </div>
                    
                    <button type="submit" class="button expanded primary" style="margin-top: 20px;">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
